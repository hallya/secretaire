# Proof CI (T4): every code change is built and tested.
# A red run is the "before" proof; a green run is the "after" proof.
name: CI

on:
  push:
    branches: [main]
    # Notes and documentation do not trigger the CI
    # (notably Obsidian's small automatic commits, D-013).
    paths-ignore:
      - "notes/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "notes/**"
      - "**.md"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  tests-natif:
    name: Tests (natif)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  compilation-wasm:
    name: Compilation (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p secretaire-core --target wasm32-unknown-unknown --locked
